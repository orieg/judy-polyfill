name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-changes:
    name: Subsystems / Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan.neon*'
              - 'psalm.xml*'
              - 'phpunit.xml*'
              - 'infection.json*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
            docs:
              - 'docs/**'
              - '*.md'

  behavior:
    name: behavior (PHP ${{ matrix.php-version }}, no extension)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2, phpunit
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-
            composer-${{ runner.os }}-
      - name: Resilient Composer install
        run: |
          composer validate --strict
          for i in 1 2 3; do composer install --no-interaction --prefer-dist && break || sleep 5; done
      - name: PHPUnit test suite
        run: vendor/bin/phpunit || phpunit
      - name: Behavior tests (standalone script)
        run: php tests/behavior.php

  static-analysis:
    name: Static Analysis (PHPStan L9 & Psalm)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2, phpstan, psalm, phpunit
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-
            composer-${{ runner.os }}-
      - name: Resilient Composer install
        run: |
          for i in 1 2 3; do composer install --no-interaction --prefer-dist && break || sleep 5; done
      - name: PHPStan Analysis (Level 9)
        run: |
          echo "### PHPStan Static Analysis (Level 9)" >> "$GITHUB_STEP_SUMMARY"
          if vendor/bin/phpstan analyse -l 9 src || phpstan analyse -l 9 src; then
            echo "🟢 **PHPStan Level 9**: 0 errors found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🔴 **PHPStan Level 9**: Static analysis errors detected" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Psalm Analysis
        run: |
          echo "### Psalm Static Analysis" >> "$GITHUB_STEP_SUMMARY"
          if vendor/bin/psalm --output-format=github || psalm --output-format=github; then
            echo "🟢 **Psalm**: 0 errors found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🔴 **Psalm**: Errors detected" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  mutation-testing:
    name: Mutation Testing (Infection MSI >= 90%)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2, phpunit, infection
          coverage: pcov
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-
            composer-${{ runner.os }}-
      - name: Resilient Composer install
        run: |
          for i in 1 2 3; do composer install --no-interaction --prefer-dist && break || sleep 5; done
      - name: Run Infection Mutation Testing
        run: |
          echo "## 🧬 Infection Mutation Testing Summary" >> "$GITHUB_STEP_SUMMARY"
          vendor/bin/infection --threads=max --formatter=progress || infection --threads=max --formatter=progress || true
          if [ -f infection-summary.log ]; then
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            cat infection-summary.log >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  parity:
    name: parity (PHP ${{ matrix.php-version }}, vs ext-judy)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-
            composer-${{ runner.os }}-
      - name: Resilient Composer install
        run: |
          for i in 1 2 3; do composer install --no-interaction --prefer-dist && break || sleep 5; done
      - name: Install ext-judy via PIE (default = bundled libJudy)
        run: |
          curl --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors --retry-connrefused -fsSL https://github.com/php/pie/releases/latest/download/pie.phar \
            -o /usr/local/bin/pie && chmod +x /usr/local/bin/pie
          sudo pie install orieg/judy
          php -r 'echo "ext-judy ", judy_version(), PHP_EOL;'
      - name: Parity tests (polyfill vs native)
        run: php tests/parity.php
      - name: Behavior tests (with extension loaded)
        run: php tests/behavior.php

  parity-legacy:
    name: parity (ext-judy ${{ matrix.ext-version }}, from source)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ext-version: "v2.4.2"
            configure-args: "--with-judy=/usr"
          - ext-version: "v2.5.0"
            configure-args: "--with-judy=/usr"
          - ext-version: "v2.6.0"
            configure-args: "--with-judy=/usr"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: orieg/php-judy
          ref: ${{ matrix.ext-version }}
          path: ext-src
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-
            composer-${{ runner.os }}-
      - name: Resilient Composer install
        run: |
          for i in 1 2 3; do composer install --no-interaction --prefer-dist && break || sleep 5; done
      - name: Build ext-judy ${{ matrix.ext-version }}
        run: |
          sudo apt-get update && sudo apt-get install -y libjudy-dev
          cd ext-src
          phpize
          ./configure ${{ matrix.configure-args }}
          make -j"$(nproc)"
          php -d extension="$PWD/modules/judy.so" -r 'echo "ext-judy ", judy_version(), PHP_EOL;'
      - name: Parity tests (polyfill vs native)
        run: php -d extension="$PWD/ext-src/modules/judy.so" tests/parity.php
      - name: Behavior tests (with extension loaded)
        run: php -d extension="$PWD/ext-src/modules/judy.so" tests/behavior.php

  ci-gate:
    name: CI Gate / All Checks Passed
    if: always()
    needs:
      - detect-changes
      - behavior
      - parity
      - parity-legacy
      - static-analysis
      - mutation-testing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Dependency Statuses
        shell: bash
        run: |
          echo "Evaluating CI matrix health..."
          STATUSES='${{ toJson(needs) }}'
          FAILED=()

          for job in $(echo "$STATUSES" | jq -r 'keys[]'); do
            result=$(echo "$STATUSES" | jq -r --arg j "$job" '.[$j].result')
            echo "  Job [$job]: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED+=("$job")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::The following required checks failed: ${FAILED[*]}"
            exit 1
          fi

          echo "::notice::All applicable CI checks passed (or were cleanly skipped by path filters)."
          exit 0
