name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  nightly-matrix:
    name: Nightly Verification (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]
        include:
          - php-version: "8.6"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2, phpunit, phpstan, psalm, infection
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-
            composer-${{ runner.os }}-

      - name: Resilient Composer install
        run: |
          for i in 1 2 3; do composer install --no-interaction --prefer-dist && break || sleep 5; done

      - name: PHPUnit tests
        run: vendor/bin/phpunit || phpunit

      - name: Behavior tests
        run: php tests/behavior.php

      - name: PHPStan Analysis (Level 9)
        run: vendor/bin/phpstan analyse -l 9 src || phpstan analyse -l 9 src

      - name: Psalm Analysis
        run: vendor/bin/psalm || psalm

      - name: Infection Mutation Testing (MSI >= 90%)
        if: matrix.php-version == '8.3'
        run: vendor/bin/infection --threads=max --min-msi=90 --min-covered-msi=90 || infection --threads=max --min-msi=90 --min-covered-msi=90

      - name: Report or Update Nightly Failure Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 [Nightly CI Failure] PHPStan / PHP-dev Verification Failed on main';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });

            const existing = issues.find(i => i.title.includes('Nightly CI Failure') || i.title.includes('PHPStan'));
            const body = [
              '### Nightly Verification Failure Alert',
              '',
              `- **Commit**: [${context.sha}](${context.payload.repository?.html_url}/commit/${context.sha})`,
              `- **Workflow Run**: [View Failed Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **Failing Target**: PHP ${{ matrix.php-version }} Nightly Sweep`,
              '',
              '#### Local Reproduction Command:',
              '```bash',
              'composer install',
              'vendor/bin/phpunit',
              'vendor/bin/phpstan analyse -l 9 src',
              'vendor/bin/psalm',
              '```'
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `⚠️ Nightly run still failing on PHP ${{ matrix.php-version }} at commit ${context.sha}. [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'nightly-failure', 'automated-triage']
              });
            }

      - name: Auto-Close Resolved Nightly Issue on Success
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });
            const existing = issues.find(i => i.title.includes('Nightly CI Failure') || i.title.includes('PHPStan'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `🟢 Nightly verification succeeded on commit ${context.sha}! Auto-closing this issue.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }
