name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-matrix:
    name: Nightly Verification (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]
        include:
          # 8.6 is a dev build: the static-analysis tools pin exact PHP minors
          # and have no 8.6 release yet, so dependency resolution fails on the
          # platform requirement alone. Ignoring it keeps the leg useful — the
          # tests and PHPStan still run and still report — and the job is
          # experimental, so it cannot fail the sweep or open an issue.
          - php-version: "8.6"
            experimental: true
            composer-flags: "--ignore-platform-req=php"
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-
            composer-${{ runner.os }}-

      # Retries cover transient network failures. A genuine resolution error
      # must still fail the step: the previous version ended each attempt with
      # `|| sleep 5`, so the loop's exit status was the sleep's and the step
      # reported SUCCESS after three failed installs — leaving vendor/ missing
      # and every later step to fail confusingly instead.
      - name: Composer install
        run: |
          for attempt in 1 2 3; do
            if composer install --no-interaction --no-progress --prefer-dist ${{ matrix.composer-flags }}; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::error::composer install failed after 3 attempts"; exit 1; fi
            sleep 5
          done

      # No `|| <global tool>` fallbacks below. They looked like resilience but
      # ran a PHAR against a project with no vendor/ — turning "install failed"
      # into an unrelated error several steps later.
      - name: PHPUnit tests
        run: vendor/bin/phpunit

      - name: Behavior tests
        run: php tests/behavior.php

      - name: PHPStan Analysis (Level 9)
        run: vendor/bin/phpstan analyse -l 9 src --no-progress

      - name: Psalm Analysis
        if: matrix.experimental != true
        run: vendor/bin/psalm --no-progress

      # Thresholds are a regression ratchet at the measured level, not a target.
      # They read low because Infection only sees the PHPUnit suite: the checks
      # that actually cover this library — tests/behavior.php and the native
      # parity suite — are standalone scripts it cannot run. Raise these as
      # coverage moves into PHPUnit; do not lower them.
      - name: Infection Mutation Testing
        if: matrix.php-version == '8.3'
        run: vendor/bin/infection --threads=max --min-msi=60 --min-covered-msi=65 --no-progress

  # Issue bookkeeping lives in its own job so it sees the WHOLE sweep. Run from
  # inside the matrix it raced itself: each passing version closed the issue the
  # failing version had just opened, so the issue flapped nightly. Experimental
  # legs are continue-on-error, so they land here as success and cannot report.
  report:
    name: Nightly issue bookkeeping
    needs: nightly-matrix
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const failed = ${{ needs.nightly-matrix.result == 'failure' }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure',
            });
            const existing = issues.find(i => i.title.includes('Nightly CI Failure'));

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `🟢 Nightly verification succeeded at ${context.sha}. Auto-closing.\n\n[View run](${runUrl})`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            // The body names no specific tool: the previous template always said
            // "PHPStan / PHP-dev", which sent readers to the wrong place when the
            // failure was Infection or a composer resolution error.
            const body = [
              '### Nightly verification failed',
              '',
              `- **Commit**: [${context.sha}](${context.payload.repository?.html_url}/commit/${context.sha})`,
              `- **Run**: [View logs](${runUrl}) — the failing job and step are named there`,
              '',
              'Reproduce locally:',
              '```bash',
              'composer install',
              'vendor/bin/phpunit',
              'php tests/behavior.php',
              'vendor/bin/phpstan analyse -l 9 src',
              'vendor/bin/psalm',
              'vendor/bin/infection --threads=max --min-msi=60 --min-covered-msi=65',
              '```',
              '',
              'Infection needs a coverage driver (`pcov` or Xdebug); without one it',
              'reports MSI 0% for a reason unrelated to the tests.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `⚠️ Still failing at ${context.sha}. [View run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 [Nightly CI Failure] Verification failed on main',
                body,
                labels: ['bug', 'nightly-failure', 'automated-triage'],
              });
            }
